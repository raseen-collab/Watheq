<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — وثيق لإدارة الأملاك</title>
<meta name="description" content="الصفحة التي تبحث عنها غير موجودة أو تغيّر رابطها. عُد إلى الصفحة الرئيسية لمنصة وثيق، أو جرّب الحاسبات العقارية المجانية.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0E3A37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#FBF8F1;color:#0B211F;
       min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.8}
  .box{max-width:520px;text-align:center}
  .seal{width:64px;height:64px;border-radius:16px;background:#0E3A37;display:grid;place-items:center;
        color:#E7C877;font-family:"Readex Pro";font-weight:700;font-size:1.9rem;margin:0 auto 22px;
        box-shadow:inset 0 0 0 2px rgba(231,200,119,.35)}
  .code{font-family:"Readex Pro";font-weight:700;font-size:3.4rem;color:#0E3A37;line-height:1;margin-bottom:10px}
  h1{font-family:"Readex Pro";font-weight:600;font-size:1.25rem;color:#0E3A37;margin-bottom:10px}
  p{color:#5C6B67;font-size:.95rem;margin-bottom:26px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;padding:.7rem 1.3rem;
       border-radius:.7rem;text-decoration:none;transition:all .15s ease;font-size:.95rem}
  .gold{background:#B8791F;color:#fff}
  .gold:hover{background:#8a5a11}
  .ghost{background:#fff;color:#0E3A37;border:1px solid #E4DDCD}
  .ghost:hover{background:#F3EEE2}
  .links{margin-top:26px;padding-top:18px;border-top:1px solid #E4DDCD;font-size:.85rem}
  .links a{color:#0E3A37;text-decoration:none;margin:0 9px;font-weight:500}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="box">
    <div class="seal">و</div>
    <div class="code">404</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>ربما تغيّر الرابط أو حُذفت الصفحة. لا بأس — كل شيء على بعد ضغطة واحدة.</p>
    <div class="row">
      <a class="btn gold" href="/">العودة للرئيسية</a>
      <a class="btn ghost" href="/calculators.html">الحاسبات المجانية</a>
    </div>
    <div class="links">
      <a href="/properties.html">إدارة الأملاك</a>·
      <a href="https://app.watheqapp.com/demo">لوحة التحكّم</a>·
      <a href="/legal.html">الشروط والخصوصية</a>
    </div>
  </main>
<!-- مصدر الزيارة: يُشتق من الرابط أو من الصفحة التي أتى منها الزائر، ثم يُمرَّر
     في روابط الموقع فقط. بلا كوكيز وبلا تخزين وبلا طرف ثالث — نفس مبدأ
     lib/signup-sources.ts: القيمة تأتي من رابطنا أو مما يرسله المتصفح، لا من
     بصمة. وما لا نعرفه يبقى فارغًا؛ مصدر خاطئ أسوأ من مصدر مجهول. -->
<script>
(function () {
  try {
    var KNOWN = ["haraj", "group", "twitter", "search", "referral", "direct", "other", "demo"];

    function fromReferrer() {
      var r = document.referrer || "";
      if (!r) return "";
      var h;
      try { h = new URL(r).hostname.replace(/^www\./, "").toLowerCase(); } catch (e) { return ""; }
      if (h === "watheqapp.com" || /\.watheqapp\.com$/.test(h)) return "";  // من موقعنا: لا جديد
      var L = h.split(".");
      function has(x) { return L.indexOf(x) >= 0; }
      if (has("google") || has("bing") || has("duckduckgo") || has("yandex") || has("ecosia")
          || h.indexOf("search.yahoo.") === 0) return "search";
      if (has("twitter") || h === "x.com" || h === "t.co") return "twitter";
      if (has("haraj")) return "haraj";
      if (has("whatsapp") || h === "wa.me" || has("telegram") || h === "t.me") return "group";
      return "";   // مصدر لا نعرفه: يبقى فارغًا عمدًا
    }

    var src = "";
    try { src = new URL(location.href).searchParams.get("src") || ""; } catch (e) {}
    if (KNOWN.indexOf(src) < 0) src = fromReferrer();
    if (KNOWN.indexOf(src) < 0) return;

    var a = document.getElementsByTagName("a");
    for (var i = 0; i < a.length; i++) {
      var href = a[i].getAttribute("href") || "";
      if (!href || href.charAt(0) === "#") continue;
      var u;
      try { u = new URL(href, location.href); } catch (e) { continue; }
      if (u.protocol !== "http:" && u.protocol !== "https:") continue;
      var mine = u.hostname === location.hostname
              || u.hostname === "watheqapp.com" || /\.watheqapp\.com$/.test(u.hostname);
      if (!mine) continue;                       // لا يُرسَل إلى أي موقع خارجي
      if (u.searchParams.get("src")) continue;   // رابط حملة صريح: لا يُلمس
      u.searchParams.set("src", src);
      a[i].setAttribute("href", u.toString());
    }
  } catch (e) { /* لا يعطّل الصفحة أبدًا */ }
})();
</script>
</body>
</html>
